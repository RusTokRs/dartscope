[package]
name = "dartscope-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Language Server Protocol bridge for DartScope (editor integration, UTF-16 handling)"
documentation = "https://docs.rs/dartscope-lsp"

[features]
# Optional downstream lint adapter for the stdio binary. The library API keeps
# the explicit `set_supplemental_diagnostics` port either way; enabling this
# feature only wires the binary to run `dartscope-lints` over the same index
# snapshot it maintains for navigation.
lints = ["dep:dartscope-lints"]

[dependencies]
dartscope-core.workspace = true
dartscope-parse.workspace = true
dartscope-index.workspace = true
dartscope-lints = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
