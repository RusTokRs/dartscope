name: Audit probe final

# TEMPORARY: last verification round of the engineering audit. Removed before hand-off.
on:
  push:
    branches: ['arena/01a0f406-dartscope']
    paths:
      - 'audit-probe/trigger-final'
      - '.github/workflows/audit-probe-final.yml'

permissions:
  contents: read

concurrency:
  group: audit-probe-final
  cancel-in-progress: true

jobs:
  final:
    name: ${{ matrix.job }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: patches
            os: windows-2025
          - job: applycheck
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Keep LF line endings
        if: matrix.job == 'patches'
        shell: bash
        run: git config --global core.autocrlf false && git config --global core.eol lf
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Run probe
        shell: bash
        run: bash audit-probe/final/${{ matrix.job }}.sh

