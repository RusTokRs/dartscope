name: Audit probe unblock

# TEMPORARY: verifies a candidate minimal patch. Removed before hand-off.
on:
  push:
    branches: ['arena/01a0f406-dartscope']
    paths:
      - 'audit-probe/trigger-unblock'
      - '.github/workflows/audit-probe-unblock.yml'

permissions:
  contents: read

concurrency:
  group: audit-probe-unblock
  cancel-in-progress: true

jobs:
  unblock:
    name: unblock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Verify candidate patch
        shell: bash
        run: bash audit-probe/unblock.sh
