name: Audit probe extra

# TEMPORARY: engineering-audit probe (part 2). Removed before hand-off.
on:
  push:
    branches: ['arena/01a0f406-dartscope']
    paths:
      - 'audit-probe/extra.sh'
      - 'audit-probe/trigger-extra'
      - '.github/workflows/audit-probe-extra.yml'

permissions:
  contents: read

concurrency:
  group: audit-probe-extra
  cancel-in-progress: true

jobs:
  extra:
    name: extra (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Extra probes
        shell: bash
        run: bash audit-probe/extra.sh
